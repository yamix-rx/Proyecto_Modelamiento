name: Compilar topologia calidad N28
on:
  push:
    branches:
      - entrega-topologia-calidad-n28
    paths:
      - 'Entregas/Calidad_y_Pruebas/generar_pkt.py'
      - '.github/workflows/compilar_topologia_n28.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pkt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramienta de exportacion
        run: python -m pip install pktlib==0.2.2
      - name: Generar fichero nativo Cisco Packet Tracer
        run: python Entregas/Calidad_y_Pruebas/generar_pkt.py
      - name: Verificar .pkt
        run: python -m pktlib info Entregas/Calidad_y_Pruebas/Topologia_Calidad_Farmacia_Sanet_N28.pkt
      - name: Guardar entrega en rama aislada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Entregas/Calidad_y_Pruebas/Topologia_Calidad_Farmacia_Sanet_N28.pkt
          if ! git diff --cached --quiet; then
            git commit -m "Generar archivo Packet Tracer N28"
            git push
          fi
